name: CI
on:
  push:
    branches: [ dev, bump-deps ]
  pull_request:
jobs:
  build:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v3
      with:
        node-version-file: '.nvmrc'
    - run: yarn install --frozen-lockfile
    - run: yarn build
    - run: yarn test
