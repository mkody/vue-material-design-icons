version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: daily
    time: "02:00"
  open-pull-requests-limit: 10
  target-branch: bump-deps
  assignees:
  - mkody
  versioning-strategy: increase
  commit-message:
    prefix: feat
    prefix-development: chore
    include: scope
